plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.runeai.RuneAIPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

// Tests must NEVER touch the real ~/.runelite — the lifecycle harness writes
// real ledger files (offer-state, flip-basis, trader) through the same code
// paths the plugin uses, so the whole test JVM gets a sandboxed home.
tasks.named('test') {
	systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile.absolutePath
}

// Off-client smoke test against the LIVE wiki prices API: runs the real
// scanner, then checks the ranking's invariants (insta prices really cross the
// spread, nets are positive, no price-tier filtering). Writes are sandboxed;
// no RuneLite client is launched.
tasks.register('liveScan', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.runeai.LiveScanHarness'
	systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile.absolutePath
}

group = 'com.runeai'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Trained models ship with the plugin as ordinary resources in
// src/main/resources/com/runeai/. They live there rather than in train/ and
// being copied at build time, because the Plugin Hub builds submissions with
// `build=standard`, which REPLACES this build.gradle -- any custom
// processResources step is silently discarded and the model would be missing
// from the published jar. The trainers write straight into that directory.
//
// damage_model.json is gitignored -- it is derived from recorded play, so it
// only exists on a machine where the trainer has been run. A clean checkout
// simply builds without it and the danger prior stays inert; nothing here ever
// puts it in a commit.

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
